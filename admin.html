
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم | مشتل سما الكوت</title>
<style>
body{margin:0;background:#f5f6f0;color:#183d2c;font-family:Arial,sans-serif;padding:18px}
main{max-width:850px;margin:auto}
header,.panel{background:white;padding:20px;border-radius:16px;margin-bottom:16px;border:1px solid #ddd}
h1{font-size:24px}h2{font-size:19px}
input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:9px;font-size:16px}
button{background:#174c35;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#eee;color:#222}
button.danger{background:#9b2727}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}
.item img{width:90px;height:90px;object-fit:cover;border-radius:8px}
.muted{color:#666;font-size:14px}
#app{display:none}
</style>
</head>
<body>
<main>
<header>
<h1>🌿 مشتل سما الكوت</h1>
<p>لوحة إدارة المنتجات والأسعار</p>
</header>

<section class="panel" id="login">
<h2>تسجيل دخول المدير</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
<input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button id="loginBtn">دخول</button>
<p id="loginMsg" class="muted">سجّل الدخول بحساب المدير الذي أنشأته في Supabase.</p>
</section>

<section id="app">
<div class="panel">
<div class="row">
<button id="nurseryBtn">🌱 منتجات المشتل</button>
<button id="decorBtn">✨ منتجات سما ديكور</button>
</div>
<button class="secondary" id="logoutBtn">تسجيل الخروج</button>
<h2 id="formTitle">إضافة منتج جديد</h2>
<input id="productName" placeholder="اسم النبات أو المنتج">
<textarea id="description" placeholder="وصف المنتج"></textarea>
<div class="row">
<input id="price" type="number" min="0" step="250" placeholder="السعر بالدينار العراقي">
<select id="category"></select>
</div>
<label for="photo">صورة المنتج</label>
<input id="photo" type="file" accept="image/*">
<p class="muted">يمكن اختيار صورة من جهازك. تُرفع إلى مخزن صور Supabase.</p>
<button id="saveBtn">حفظ المنتج</button>
<button class="secondary" id="cancelBtn" style="display:none">إلغاء التعديل</button>
<p id="msg" class="muted"></p>
</div>

<div class="panel">
<h2>المنتجات الحالية</h2>
<div id="products">جارٍ التحميل...</div>
</div>
</section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=id=>document.getElementById(id);
let db,brand="nursery",categories=[],editing=null,products=[];

function message(t){$("msg").textContent=t}
function loginMessage(t){$("loginMsg").textContent=t}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function start(){
 if(!window.SAMA_CONFIG?.url||!window.SAMA_CONFIG?.key){
  loginMessage("إعدادات Supabase غير موجودة في config.js.");return;
 }
 db=window.supabase.createClient(window.SAMA_CONFIG.url,window.SAMA_CONFIG.key);
 const {data}=await db.auth.getSession();
 if(data.session) await openApp();
}
async function openApp(){
 $("login").style.display="none";$("app").style.display="block";
 await loadCategories();await loadProducts();
}
$("loginBtn").onclick=async()=>{
 loginMessage("جارٍ تسجيل الدخول...");
 const {error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),password:$("password").value
 });
 if(error){loginMessage("تعذر الدخول: "+error.message);return}
 await openApp();
};
$("logoutBtn").onclick=async()=>{
 await db.auth.signOut();location.reload();
};

async function loadCategories(){
 const {data,error}=await db.from("categories").select("id,name,brand").order("sort_order");
 if(error){message("تعذر تحميل التصنيفات: "+error.message);return}
 categories=data||[];renderCategories();
}
function renderCategories(){
 const list=categories.filter(c=>c.brand===brand);
 $("category").innerHTML=list.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
}
async function loadProducts(){
 $("products").textContent="جارٍ تحميل المنتجات...";
 const {data,error}=await db.from("products")
  .select("id,category_id,name,description,price,image_url,brand,is_available")
  .eq("brand",brand).order("id",{ascending:false});
 if(error){$("products").textContent="تعذر التحميل. تأكد من صلاحيات قاعدة البيانات.";return}
 products=data||[];renderProducts();
}
function renderProducts(){
 if(!products.length){$("products").textContent="لا توجد منتجات بهذا القسم حالياً.";return}
 $("products").innerHTML=products.map(p=>`
 <article class="item">
 ${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:""}
 <h3>${esc(p.name)}</h3>
 <p>${esc(p.description)}</p>
 <strong>${Number(p.price).toLocaleString("en-US")} د.ع</strong>
 <div class="row">
 <button data-edit="${p.id}">تعديل</button>
 <button class="danger" data-delete="${p.id}">حذف</button>
 </div></article>`).join("");
}
$("nurseryBtn").onclick=async()=>{brand="nursery";editing=null;renderCategories();resetForm();await loadProducts()};
$("decorBtn").onclick=async()=>{brand="sama_decor";editing=null;renderCategories();resetForm();await loadProducts()};

function resetForm(){
 editing=null;$("productName").value="";$("description").value="";
 $("price").value="";$("photo").value="";
 $("formTitle").textContent="إضافة منتج جديد";
 $("saveBtn").textContent="حفظ المنتج";$("cancelBtn").style.display="none";
}
$("cancelBtn").onclick=resetForm;

$("products").onclick=async e=>{
 const edit=e.target.dataset.edit,del=e.target.dataset.delete;
 if(edit){
  const p=products.find(x=>x.id===Number(edit));if(!p)return;
  editing=p;$("productName").value=p.name;$("description").value=p.description||"";
  $("price").value=p.price;$("category").value=p.category_id;
  $("formTitle").textContent="تعديل المنتج";
  $("saveBtn").textContent="حفظ التعديلات";$("cancelBtn").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
 }
 if(del){
  const p=products.find(x=>x.id===Number(del));if(!p)return;
  if(!confirm("متأكد تريد حذف "+p.name+"؟"))return;
  const {error}=await db.from("products").delete().eq("id",p.id);
  if(error){message("فشل الحذف. تأكد من صلاحيات المدير.");return}
  message("تم حذف المنتج.");await loadProducts();
 }
};

$("saveBtn").onclick=async()=>{
 const name=$("productName").value.trim();
 const price=Number($("price").value);
 if(!name||$("price").value===""||price<0||!Number.isFinite(price)){
  message("أدخل اسم المنتج والسعر بصورة صحيحة.");return;
 }
 const categoryId=Number($("category").value);
 if(!categoryId){message("اختر التصنيف أولاً.");return}
 $("saveBtn").disabled=true;message("جارٍ الحفظ...");
 try{
  let imageUrl=editing?.image_url||null;
  const file=$("photo").files[0];
  if(file){
   if(!file.type.startsWith("image/"))throw Error("الملف المختار ليس صورة.");
   if(file.size>8*1024*1024)throw Error("حجم الصورة يجب أن يكون أقل من 8 ميغابايت.");
   const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"");
   const path=`${brand}/${crypto.randomUUID()}.${ext}`;
   const {error:upErr}=await db.storage.from("plant-images").upload(path,file,{upsert:false});
   if(upErr)throw upErr;
   const {data:urlData}=db.storage.from("plant-images").getPublicUrl(path);
   imageUrl=urlData.publicUrl;
  }
  const item={
   name,description:$("description").value.trim(),
   price,category_id:categoryId,image_url:imageUrl,brand,
   is_available:true
  };
  let result;
  if(editing) result=await db.from("products").update(item).eq("id",editing.id);
  else result=await db.from("products").insert(item);
  if(result.error)throw result.error;
  message("تم الحفظ بنجاح.");resetForm();await loadProducts();
 }catch(err){
  message("لم يتم الحفظ: "+(err.message||"تحقق من صلاحيات قاعدة البيانات ومخزن الصور."));
 }finally{$("saveBtn").disabled=false}
};
start();
</script>
</body>
</html>
